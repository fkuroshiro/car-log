services:
  app:
    build: .
    container_name: car-log
    ports:
      - '8081:8081'
    volumes:
      # Live reload: the source is mounted, so code edits on the host are
      # picked up by the dev server without rebuilding the image.
      - .:/app
      # node_modules stays inside the container (seeded from the image),
      # independent of whatever is installed on the host.
      - node_modules:/app/node_modules
    restart: unless-stopped

  # Production: static export behind the shared reverse proxy at
  # fkuroshiro.xyz/car-log. Rebuild to deploy: docker compose up -d --build web
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL}
        EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY}
    image: car-log-web:local
    container_name: car-log-web
    networks:
      - proxy-net
    restart: unless-stopped

volumes:
  node_modules:

networks:
  proxy-net:
    external: true
