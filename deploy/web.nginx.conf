# Serves the static Expo export inside the car-log-web container.
# The reverse proxy strips the /car-log prefix, so everything here is rooted.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles never change content under the same name.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pre-rendered pages are route.html files; anything unknown (e.g. dynamic
    # /cars/<id> URLs) falls back to the SPA entry and the client router
    # takes over.
    location / {
        try_files $uri $uri.html /index.html;
    }
}
